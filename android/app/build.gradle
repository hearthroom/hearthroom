plugins { id 'com.android.application' }
android {
    namespace 'club.hearthroom.app'
    compileSdk 36
    defaultConfig {
        applicationId 'club.hearthroom.app'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(providers.gradleProperty('releaseCode').getOrElse('1'))
        versionName providers.gradleProperty('releaseName').getOrElse('0.1.0-dev')
        buildConfigField 'String', 'UPDATE_URL', '"https://downloads.hearthroom.club/latest.json"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
