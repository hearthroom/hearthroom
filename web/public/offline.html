<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hearthroom</title>
    <meta name="theme-color" content="#f5f5f7" />
    <style>
      :root { color-scheme: light dark; --bg: #f5f5f7; --surface: #fff; --text: #17171c; --text-2: #5c5c67; --line: rgba(16,16,24,.08); --accent: #ef4f6f; --accent-deep: #cf2f52; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101013; --surface: #1a1a1f; --text: #f2f2f5; --text-2: #a0a0ab; --line: rgba(255,255,255,.08); } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
             font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", sans-serif; }
      .card { width: min(100%, 360px); padding: 28px 24px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 12px 32px -8px rgba(16,16,24,.22); text-align: center; }
      .mark { width: 40px; height: 40px; margin: 0 auto 12px; fill: var(--accent); }
      h1 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; color: var(--text-2); }
      button { appearance: none; border: 0; padding: 10px 18px; border-radius: 999px; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
               background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%); }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-7.5L7 21.5V18H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" /></svg>
      <h1 id="t"></h1>
      <p id="d"></p>
      <button type="button" id="r" onclick="location.reload()"></button>
    </main>
    <script>
      (function () {
        var L = {
          "zh-Hant": ["目前離線", "連不上網路。連線恢復後再試一次。", "重試"],
          "zh-Hans": ["当前离线", "连不上网络。连接恢复后再试一次。", "重试"],
          en: ["You’re offline", "The network is unreachable. Try again once you’re back online.", "Retry"],
          ja: ["オフラインです", "ネットワークに接続できません。接続が戻ったらもう一度お試しください。", "再試行"],
          ko: ["오프라인 상태입니다", "네트워크에 연결할 수 없습니다. 연결이 복구되면 다시 시도하세요.", "다시 시도"]
        };
        var seg = location.pathname.split("/")[1];
        var lang = L[seg] ? seg : (function (n) {
          n = String(n || "").toLowerCase();
          if (n.indexOf("zh") === 0) return /tw|hk|mo|hant/.test(n) ? "zh-Hant" : "zh-Hans";
          if (n.indexOf("ja") === 0) return "ja";
          if (n.indexOf("ko") === 0) return "ko";
          return "en";
        })(navigator.language);
        var s = L[lang];
        document.documentElement.lang = lang;
        document.getElementById("t").textContent = s[0];
        document.getElementById("d").textContent = s[1];
        document.getElementById("r").textContent = s[2];
      })();
    </script>
  </body>
</html>
