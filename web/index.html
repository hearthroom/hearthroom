<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Taproom</title>
    <meta name="description" content="An open community for character cards: rankings, search, and creator pages." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ef4f6f' d='M5 3h14a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-7.5L7 21.5V18H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#f5f5f7" />
    <!--
      外觀在第一次繪製之前就決定好：讀本機存的偏好，沒有就跟系統。
      放在 <head> 的同步腳本是唯一不會先閃一下另一種顏色的位置。鍵名與 lib/appearance.ts 一致。
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var mode = localStorage.getItem("taproom.mode");
          var theme = localStorage.getItem("taproom.theme");
          var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          d.dataset.mode = dark ? "dark" : "light";
          if (theme) d.dataset.theme = theme;
          // 瀏覽器外框的顏色也在這裡就定：只有「紙」動了紙色，其餘主題共用預設值
          var bg = theme === "sepia" ? { light: "#f4efe6", dark: "#17130f" } : { light: "#f5f5f7", dark: "#101013" };
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = dark ? bg.dark : bg.light;
        } catch (e) { document.documentElement.dataset.mode = "light"; }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
