    <meta property="og:title" content="绮梦社・AI寝物语" />
    <meta property="og:description" content="和 AI 角色一起写故事：恋爱、冒险、世界模拟、玩法模拟，挑一张角色卡就能开聊，故事跟着你的选择走。" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="绮梦社・AI寝物语" />
    <meta name="twitter:description" content="和 AI 角色一起写故事：恋爱、冒险、世界模拟、玩法模拟，挑一张角色卡就能开聊，故事跟着你的选择走。" />

    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <meta name="theme-color" content="#f5f5f7" />
    <!-- 可安裝：manifest 與圖示。快取不做，service worker 只提供離線頁（public/sw.js）。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 給 AI agent 的站點索引（public/llms.txt）；文件頁另有 .md 孿生檔，由 lib/markdown-twin.ts 逐頁掛上 -->
    <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hearthroom" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      外觀在第一次繪製之前就決定好：讀本機存的偏好，沒有就跟系統。
      放在 <head> 的同步腳本是唯一不會先閃一下另一種顏色的位置。鍵名與 lib/appearance.ts 一致。
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var mode = localStorage.getItem("hearthroom.mode");
          var theme = localStorage.getItem("hearthroom.theme");
          var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          d.dataset.mode = dark ? "dark" : "light";
          if (theme) d.dataset.theme = theme;
          // 瀏覽器外框的顏色也在這裡就定：只有「紙」動了紙色，其餘主題共用預設值
          var bg = theme === "sepia" ? { light: "#f4efe6", dark: "#17130f" } : { light: "#f5f5f7", dark: "#101013" };
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = dark ? bg.dark : bg.light;
        } catch (e) { document.documentElement.dataset.mode = "light"; }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
