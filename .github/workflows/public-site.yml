name: Public site CI

on:
  push:
    branches: [main]
    paths-ignore: ['marketing-mail/**', '.github/workflows/marketing-mail.yml']
  pull_request:
    paths-ignore: ['marketing-mail/**', '.github/workflows/marketing-mail.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/public-ci.test.mjs scripts/test-scope.test.mjs
      - run: node scripts/public-sandbox-contract.mjs --check-pin
      - run: npm run typecheck
      - run: npm run test:public
      - run: npm run build:public
      - run: test ! -e stage/package.json && test ! -d web/dist-public/sandbox
      - name: Run Worker tests against the public build
        run: |
          test -f web/dist-public/index.html
          # The tests use Wrangler's configured web/dist asset directory.
          ln -s dist-public web/dist
          npm run test:api

  # 每個使用者感覺得到的 commit 都要交代屬於哪則更新說明（updates/README.md）。
  # 獨立一個 job，不擋部署：為了缺一份說明擋掉緊急修正，代價比晚一點補說明大。
  # 紅了就是真的缺，下一個 commit 補上說明或 `Update: none`。
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every user-visible commit names its update entry
        env:
          RANGE_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/updates/check-commits.mjs --range "${RANGE_FROM}..${RANGE_TO}"
