# 手動觸發：把 GitHub secrets 裡的 Harbor 上報憑證寫進正式 Worker 的 secrets。
# 只印變數名稱，不印任何值。SHARE_VISITOR_SECRET 已存在就不動（換值會讓已記錄的訪客雜湊失效）。
name: Worker secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HARBOR_REWARDS_CLIENT_ID: ${{ secrets.HARBOR_REWARDS_CLIENT_ID }}
          HARBOR_REWARDS_CLIENT_SECRET: ${{ secrets.HARBOR_REWARDS_CLIENT_SECRET }}
          SHARE_VISITOR_SECRET_INIT: ${{ secrets.SHARE_VISITOR_SECRET_INIT }}
        run: |
          set -euo pipefail
          names() { npx wrangler secret list --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))'; }
          echo "before: $(names)"
          for k in HARBOR_REWARDS_CLIENT_ID HARBOR_REWARDS_CLIENT_SECRET; do
            test -n "${!k}" || { echo "missing GitHub secret $k"; exit 1; }
            printf '%s' "${!k}" | npx wrangler secret put "$k" >/dev/null
            echo "set $k"
          done
          if names | tr ' ' '\n' | grep -qx SHARE_VISITOR_SECRET; then
            echo "SHARE_VISITOR_SECRET already set; kept"
          else
            test -n "$SHARE_VISITOR_SECRET_INIT" || { echo "missing GitHub secret SHARE_VISITOR_SECRET_INIT"; exit 1; }
            printf '%s' "$SHARE_VISITOR_SECRET_INIT" | npx wrangler secret put SHARE_VISITOR_SECRET >/dev/null
            echo "set SHARE_VISITOR_SECRET"
          fi
          echo "after: $(names)"
