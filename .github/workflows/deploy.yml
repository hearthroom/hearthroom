name: CI & Deploy

# 每次 push 到 main：typecheck → 測試 → 建置 → 套資料庫遷移 → 部署 Worker。
# PR 只跑到建置為止。部署需要兩個 repository secrets：
#   CLOUDFLARE_API_TOKEN   Workers Scripts 編輯、D1 編輯、routes 裡每個 zone 的 DNS 與 Workers Routes 編輯
#   CLOUDFLARE_ACCOUNT_ID  帳號 ID（沒給的話 wrangler 會把帳號清單印進公開日誌）
# secrets 還沒設的時候部署步驟會跳過並留一則 notice，不會把 CI 弄紅。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-main' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          # 前端測試在 Node 26 會因為內建的 localStorage 全域而失敗；鎖 22。
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Deploy skipped (secrets not set)
        if: github.event_name != 'pull_request' && env.CAN_DEPLOY != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; build passed, deploy skipped."

      - name: Apply database migrations
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run migrate:remote

      - name: Deploy
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
