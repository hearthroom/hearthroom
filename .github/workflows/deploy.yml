name: CI & Deploy

# 每次 push 到 main：typecheck → 測試 → 建置 → 套資料庫遷移 → 部署 Worker。
# PR 只跑到建置為止。部署需要兩個 repository secrets：
#   CLOUDFLARE_API_TOKEN   Workers Scripts 編輯、D1 編輯、Workers KV Storage 編輯（歸檔 hash 檔）、
#                          routes 裡每個 zone 的 DNS 與 Workers Routes 編輯
#   CLOUDFLARE_ACCOUNT_ID  帳號 ID（沒給的話 wrangler 會把帳號清單印進公開日誌）
# secrets 還沒設的時候部署步驟會跳過並留一則 notice，不會把 CI 弄紅。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-main' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          # 前端測試在 Node 26 會因為內建的 localStorage 全域而失敗；鎖 22。
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # 先建置再測：前端測試的 moonstage/stage 別名指向 stage/ 的建置產物，沒建過會解析失敗
      - run: npm run build
      - run: npm test
      - name: Verify and build the pinned playground
        working-directory: stage
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm test
          npm run i18n:check
          npm run build:h5:prod
          node scripts/copy-playground-sandbox.mjs
          bash scripts/check-build-output.sh

      - name: Deploy skipped (secrets not set)
        if: github.event_name != 'pull_request' && env.CAN_DEPLOY != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; build passed, deploy skipped."

      - name: Detect numeric card cutover
        id: card-schema
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/card-cutover.mjs

      # Only the legacy TEXT primary key needs this first deployment. The new
      # Worker responds 503 and skips cron until the atomic migration commits.
      - name: Hold legacy card traffic for cutover
        if: env.CAN_DEPLOY == 'true' && steps.card-schema.outputs.cutover == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          sleep 120
          npx wrangler d1 time-travel info DB --json

      - name: Apply database migrations
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run migrate:remote

      - name: Deploy
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy Moonstage playground
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --cwd stage

      # 這一版的 hash 檔寫進 ASSET_ARCHIVE（30 天）。下一次部署後，還開著這一版的分頁點進沒載過的頁面時，
      # Worker 從這裡補檔（src/index.ts 的 /assets/*）；沒有它就是「按鈕沒反應」。
      # 放在兩個部署之後：歸檔失敗不能擋住上線。但也不 continue-on-error——沒歸檔到，
      # 下次部署時開著的分頁就會壞，這一輪要紅給人看見（token 缺 KV 權限時就會在這裡紅）。
      - name: Archive this build's assets for open tabs
        if: env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run archive:assets

  # 每個使用者感覺得到的 commit 都要交代屬於哪則更新說明（updates/README.md）。
  # 獨立一個 job，不擋部署：為了缺一份說明擋掉緊急修正，代價比晚一點補說明大。
  # 紅了就是真的缺，下一個 commit 補上說明或 `Update: none`。
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every user-visible commit names its update entry
        env:
          RANGE_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/updates/check-commits.mjs --range "${RANGE_FROM}..${RANGE_TO}"
