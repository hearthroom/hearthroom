name = "lunatalk-community"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# 自訂網域。workers.dev 在部分地區被 DNS 污染（實測解析到非 Cloudflare 的 IP），
# 綁自己的 zone 才連得上。OAuth 的 redirect_uri 取自 location.origin，會自動跟著換。
routes = [
  { pattern = "community.johnny.moe", custom_domain = true }
]

# 同一個 Worker 服務 API 與前端：/v1/* 走 Hono，其餘落到打包好的 SPA。
# 同源 = 前端不用處理 CORS，也只有一個部署目標。
[assets]
directory = "./web/dist"
binding = "ASSETS"
# 找不到對應檔案時回 index.html，前端路由自己接手（/cards/xxx 這種深連結才進得去）。
not_found_handling = "single-page-application"
# 但 /v1/* 要先給 Worker，否則 SPA fallback 會把 API 請求也變成 index.html。
run_worker_first = ["/v1/*", "/cards/*", "/authors/*", "/zh-Hans/cards/*", "/zh-Hans/authors/*", "/en/cards/*", "/en/authors/*", "/ja/cards/*", "/ja/authors/*", "/ko/cards/*", "/ko/authors/*"]

# 行為埋點。CF Web Analytics 管「有多少人來」，這個資料集管「他們做了什麼」。
#
# 先註解掉：Analytics Engine 要在 Cloudflare 面板上一次性啟用（Workers → Analytics Engine），
# 沒啟用時 wrangler 會拒絕整個 deploy——那會連帶擋住任何緊急修復，代價太大。
# 啟用之後把下面三行的註解拿掉再部署，事件就開始流了；在那之前 emit() 判空靜默跳過，
# 端點、X-From、beacon 全都照常運作，只是不寫任何資料點。
# 分叉的人同理：沒配這一段也能跑。
#
# [[analytics_engine_datasets]]
# binding = "EVENTS"
# dataset = "taproom_events"

[vars]
# 上游的開放 API。這裡對它只有兩種呼叫：轉發作者 token 問身分、以游客讀卡片公開資訊。
LUNATALK_API_BASE = "https://api.lunatalk.ai"
# 每輪排程同步幾張卡。D1 單次請求有時間預算，別一次拉太多。
SYNC_BATCH_SIZE = "50"
# 同步的並發上限。目標是明顯更快，不是把上游打滿——個位數就夠。
SYNC_CONCURRENCY = "6"
# 埋點總開關。設成 "false" 就一行事件都不發，分叉或本機除錯時用。
ANALYTICS_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "lunatalk-community"
database_id = "d75ecd5d-335a-42b9-8fee-db391a1cdf19"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "179537be15bb4fbc8d42b99728142d25"

# 每小時同步一批卡片的名稱、封面與熱度信號。
[triggers]
crons = ["17 * * * *"]
