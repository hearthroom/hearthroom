name = "hearthroom"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# 自訂網域。workers.dev 在部分地區被 DNS 污染（實測解析到非 Cloudflare 的 IP），
# 綁自己的 zone 才連得上。OAuth 的 redirect_uri 取自 location.origin，會自動跟著換。
# 只掛本站自己的網域；www 只做 301 到正本（見 src/site.ts）。
routes = [
  { pattern = "hearthroom.club", custom_domain = true },
  { pattern = "www.hearthroom.club", custom_domain = true },
  # 新版沙箱卡的殼：每張卡一個子網域 c<roleId>.hearthroom.club（src/sandbox.ts）。萬用網域不能當
  # custom_domain，走 zone 路由；DNS 另外要一筆代理的萬用記錄（`* AAAA 100::`，Proxied），
  # wrangler 不會替路由建 DNS。Universal SSL 蓋得到一層的 *.hearthroom.club。
  { pattern = "*.hearthroom.club/*", zone_name = "hearthroom.club" }
]

# 同一個 Worker 服務 API 與前端：/v1/* 走 Hono，其餘落到打包好的 SPA。
# 同源 = 前端不用處理 CORS，也只有一個部署目標。
[assets]
directory = "./web/dist"
binding = "ASSETS"
# 找不到對應檔案時回 index.html，前端路由自己接手（/cards/xxx 這種深連結才進得去）。
not_found_handling = "single-page-application"
# 但 /v1/* 要先給 Worker，否則 SPA fallback 會把 API 請求也變成 index.html。
# 頁面路徑全部先過 Worker：卡片與作者頁要注入分享預覽，其餘只是原樣交回資源層。
# 為什麼連 / 和 /search 也列進來：搬家時舊網域要能把每一條路徑都轉走，而這個清單是
# 「Worker 跑不跑得到」的唯一開關；漏掉的路徑在舊網域上會變成一個還能用的鏡像站。
# 靜態檔在 /assets/ 底下，不在這個清單裡，所以不會多付一次 Worker 呼叫。
run_worker_first = [
  "/", "/metrics", "/library*", "/v1/*", "/search*", "/mine*", "/wallet*", "/create*", "/auth/*",
  "/cards/*", "/authors/*", "/review*",
  # 站台 manifest 在卡片 App 網域（play.）上要 404，得先過 Worker（src/index.ts）
  "/manifest.webmanifest",
  "/zh-Hans/*", "/en/*", "/ja/*", "/ko/*",
  # /assets/* 也過 Worker：資源層找不到（舊部署的 hash 檔）時回退到 ASSET_ARCHIVE。這些檔帶 immutable
  # 快取頭，邊緣命中時不會真的進 Worker，只有 miss 才付一次呼叫。
  "/assets/*",
  # 沙箱殼頁與它的 js/css：只在 c<roleId>.hearthroom.club 子網域上有意義，Worker 補 CSP／frame-ancestors
  # 標頭再出（資源層直接出的話沒有這些標頭）；主站網域上這條路徑一樣進 Worker，然後照 SPA 規則回退。
  "/sandbox/*",
]

# 行為埋點。CF Web Analytics 管「有多少人來」，這個資料集管「他們做了什麼」。
#
# 帳號要先在面板啟用 Analytics Engine（Workers → Analytics Engine），否則 wrangler 會拒絕
# 整個 deploy。資料集不必手動建，第一次寫入時自動出現。
# 分叉的人沒配這一段也能跑：emit() 判空後靜默跳過，端點、X-From、beacon 照常運作。
# 主畫面圖示：把頭像裁成正方形 PNG（src/shortcut.ts）。帳號沒開 Images 時呼叫會失敗，程式會退回原圖。
[images]
binding = "IMAGES"

[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "hearthroom_events"

[vars]
# 卡片供應商的開放 API。本站對它只有兩種呼叫：轉發作者 token 問身分、以游客讀卡片公開資訊。
PROVIDER_API_BASE = "https://api.lunatalk.ai"
# 依來源國別改走的閘道：`CC=網址`，逗號分隔。有些地區連不上供應商的主網域，那邊的瀏覽器改打
# 對應的閘道；/v1/region 依 Cloudflare 判斷的國別把網址回給前端。本站 Worker 自己打供應商
# 仍固定用上面那個（Worker 在邊緣跑）。留空就是所有地區都走主網址。
PROVIDER_API_GATEWAYS = "CN=https://api.lunatalk.pro"
# 第二家供應商。設了才存在：沒有這一列，/v1/providers 不會列出它，登入頁也不會長出那顆按鈕，
# 帶 `X-Provider: harbor` 的請求一律 400。關掉第二家就是刪掉這一列，程式不用回退。
PROVIDER_API_BASE_HARBOR = "https://api.harperharbor.com"
# 每輪排程同步幾張卡。Worker 一次執行最多 50 個對外請求（實測 2026-09-07：批量 200 只成功 50 張，
# 其餘全部失敗保留），所以一輪最多 50，留一點餘裕給其他請求。
SYNC_BATCH_SIZE = "45"
# 同步的並發上限。目標是明顯更快，不是把上游打滿——個位數就夠。
SYNC_CONCURRENCY = "6"
# 埋點總開關。設成 "false" 就一行事件都不發，分叉或本機除錯時用。
ANALYTICS_ENABLED = "true"
# 社群審核開關。"true"＝作者提交後要經審核人蓋章才上榜：本站用作者自己的 token 讀一次整份設定
# 存成審核單的快照，定案就刪（src/review-snapshot.ts）。其餘值退回「登記即上榜」，分叉自架不想審核的人用。
REVIEW_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "Hearthroom"
database_id = "d75ecd5d-335a-42b9-8fee-db391a1cdf19"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "179537be15bb4fbc8d42b99728142d25"

# 舊部署的 hash 檔。每次 deploy 把 web/dist/assets/* 寫進來（scripts/archive-assets.mjs，30 天到期），
# 部署前就開著的分頁懶載入時才拿得到自己那一版的區塊，不會 404。index.html 不進來，永遠拿當前版。
[[kv_namespaces]]
binding = "ASSET_ARCHIVE"
id = "cf47eb790d1f4f4a9d563a596b268c5a"

# 每小時同步一批卡片的名稱、封面與熱度信號。
[triggers]
crons = ["17 * * * *"]

# Community-owned avatars; provision this bucket before deploying this revision.
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "hearthroom-avatars"
